<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
    <title>Yonaka Reader</title>
    <defs>
        <linearGradient id="night" x2="0.7" y2="1">
            <stop stop-color="#202b48"/>
            <stop offset="1" stop-color="#080d1b"/>
        </linearGradient>
        <linearGradient id="paper" x2="0" y2="1">
            <stop stop-color="#fff3d8"/>
            <stop offset="0.8" stop-color="#f5dfb5"/>
            <stop offset="1" stop-color="#c79855"/>
        </linearGradient>
        <linearGradient id="gutter">
            <stop stop-color="#f6e2bf"/>
            <stop offset="0.5" stop-color="#b98a4c"/>
            <stop offset="1" stop-color="#f6e2bf"/>
        </linearGradient>
        <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop stop-color="#fff0b5"/>
            <stop offset="0.36" stop-color="#ffcf58"/>
            <stop offset="0.7" stop-color="#e8a52d"/>
            <stop offset="1" stop-color="#9c510c"/>
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="27" fill="url(#night)"/>
    <!-- Bound cover and layered page edges. -->
    <path d="M9 28 Q36 19 64 31 Q92 19 119 28 L120 105 Q92 101 64 112 Q36 101 8 105 Z"
          fill="#101b31" stroke="#d49a3a" stroke-width="1.5"/>
    <path d="M12 25 Q37 16 64 29 Q91 16 116 25 L116 102 Q91 97 64 108 Q37 97 12 102 Z"
          fill="#d3ae75"/>
    <path d="M13 24 Q38 15 64 29 Q90 15 115 24 L115 99 Q90 94 64 105 Q38 94 13 99 Z"
          fill="#ead0a3"/>
    <!-- Open pages remain the dominant silhouette at small sizes. -->
    <path d="M14 23 Q40 12 64 29 Q88 12 114 23 L114 96 Q88 88 64 103 Q40 88 14 96 Z"
          fill="url(#paper)" stroke="#fff1d2" stroke-width="0.7"/>
    <path d="M61 27 L64 29 L67 27 L67 101 L64 103 L61 101 Z" fill="url(#gutter)" opacity="0.65"/>
    <!-- Printed lines, including text beside and below the illustration. -->
    <g fill="none" stroke="#777278" stroke-width="3.4" stroke-linecap="round">
        <path d="M21 36 Q37 33 55 38 M21 47 Q38 44 55 49 M21 58 Q38 55 55 60 M21 69 Q38 66 55 71 M21 80 Q38 77 55 82"/>
        <path d="M70 36 L75 34 M70 46 L75 44 M70 56 L75 54 M70 66 L75 64" stroke-width="2.8"/>
        <path d="M70 75 Q88 71 107 74 M70 83 Q88 79 107 82 M70 91 Q88 87 107 90" stroke-width="3"/>
    </g>
    <!-- Night-sky illustration on the right-hand page. -->
    <path d="M79 29 Q95 25 110 28 L110 68 Q95 65 79 68 Z" fill="url(#night)"/>
    <!-- Symmetric crescent face with a darker gold bevel underneath. -->
    <path d="M90 33 A17 17 0 1 1 90 63 A15 15 0 0 0 90 33 Z" fill="#9f5916" transform="translate(0 1)"/>
    <path d="M90 32 A17 17 0 1 1 90 62 A15 15 0 0 0 90 32 Z" fill="url(#gold)"/>
    <path d="M90 32 A17 17 0 0 1 105 44" fill="none" stroke="#fff0af" stroke-width="0.7"/>
    <g fill="#ffda7b">
        <path d="M85 35 L85.8 37.2 L88 38 L85.8 38.8 L85 41 L84.2 38.8 L82 38 L84.2 37.2 Z"/>
        <path d="M86 47 L86.6 48.8 L88.4 49.4 L86.6 50 L86 51.8 L85.4 50 L83.6 49.4 L85.4 48.8 Z"/>
        <path d="M84 58 L84.6 59.8 L86.4 60.4 L84.6 61 L84 62.8 L83.4 61 L81.6 60.4 L83.4 59.8 Z"/>
    </g>
</svg>
