# Application palette inspired by https://github.com/ayu-theme/ayu-colors
@baseTheme = light
@background = #F8F9FA
@foreground = #5C6166
@accentColor = #F29718
@selectionBackground = #F29718
@selectionForeground = #0D1017
@disabledForeground = #787B80
@componentBackground = #FCFCFC
@borderColor = #D9DEE3
Viewer.background = #F8F9FA
Panel.background = #F8F9FA
Viewport.background = #F8F9FA
ScrollPane.background = #F8F9FA
MenuBar.background = #FCFCFC
PopupMenu.background = #FCFCFC
MenuItem.background = #FCFCFC
Menu.background = #FCFCFC
RadioButtonMenuItem.background = #FCFCFC
ToolTip.background = #FCFCFC
ToolTip.foreground = #5C6166
TitlePane.useWindowDecorations = false
TitlePane.menuBarEmbedded = false

# Active reader controls use the Ayu accent in both palettes.
ToggleButton.toolbar.selectedBackground = @accentColor
ToggleButton.selectedForeground = #0D1017
