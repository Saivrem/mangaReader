# Manga Reader light palette
@background = #F5F7FB
@foreground = #20242D
@accentColor = #4361EE

# Shape and focus
Component.arc = 10
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.arc = 10
CheckBox.arc = 5
ProgressBar.arc = 10
TextComponent.arc = 8

# Core surfaces
Panel.background = @background
Panel.foreground = @foreground
Viewport.background = @background
ScrollPane.background = @background
MenuBar.background = #FFFFFF
MenuBar.foreground = @foreground
MenuBar.borderColor = #D7DCE5
PopupMenu.background = #FFFFFF
ToolTip.background = #2D3440
ToolTip.foreground = #FFFFFF
Separator.foreground = #D7DCE5

# Content surfaces
Button.background = #FFFFFF
Button.foreground = @foreground
TextField.background = #FFFFFF
TextField.foreground = @foreground
FormattedTextField.background = #FFFFFF
FormattedTextField.foreground = @foreground
PasswordField.background = #FFFFFF
PasswordField.foreground = @foreground
TextArea.background = #FFFFFF
TextArea.foreground = @foreground
TextPane.background = #FFFFFF
TextPane.foreground = @foreground
EditorPane.background = #FFFFFF
EditorPane.foreground = @foreground
List.background = #FFFFFF
List.foreground = @foreground
Table.background = #FFFFFF
Table.foreground = @foreground
Tree.background = #FFFFFF
Tree.foreground = @foreground

# Interaction
Component.focusColor = #4361EE
Button.hoverBackground = #E9EEFF
Button.pressedBackground = #D8E1FF
MenuItem.selectionBackground = #DCE5FF
MenuItem.selectionForeground = #172554
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.showButtons = false
ScrollBar.track = #EEF1F6
ScrollBar.thumb = #7D899B
ScrollBar.hoverThumbColor = #6B778C
ScrollBar.pressedThumbColor = #56647A
ScrollPane.smoothScrolling = true

# Application design tokens shared with custom window chrome
MangaReader.canvasBackground = #ECEFF4
MangaReader.titleBarBackground = #FFFFFF
MangaReader.titleBarForeground = #20242D
MangaReader.titleBarInactiveBackground = #F1F3F6
MangaReader.titleBarInactiveForeground = #626A78
MangaReader.titleBarBorder = #D7DCE5
MangaReader.titleBarHeight = {scaledInteger}30
MangaReader.titleBarButtonSize = {scaledDimension}44,30
MangaReader.titleBarButtonHoverBackground = #E9EDF4
MangaReader.titleBarButtonPressedBackground = #DCE2EB
MangaReader.titleBarCloseHoverBackground = #C94F5C
MangaReader.titleBarClosePressedBackground = #A73F4A
MangaReader.macTitleBarButtonSize = {scaledDimension}20,30
MangaReader.macTitleBarControlsInset = {scaledInteger}4
MangaReader.macTrafficLightClose = #FF5F57
MangaReader.macTrafficLightMinimize = #FEBC2E
MangaReader.macTrafficLightZoom = #28C840
MangaReader.macTrafficLightInactive = #7C8798
MangaReader.macTrafficLightGlyph = #342A25
MangaReader.imageBorder = #7C8798
MangaReader.windowResizeHandleThickness = {scaledInteger}5
