# Manga Reader dark palette
@background = #1B1E26
@foreground = #E8ECF3
@accentColor = #7AA2F7

# Shape and focus
Component.arc = 10
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.arc = 10
CheckBox.arc = 5
ProgressBar.arc = 10
TextComponent.arc = 8

# Core surfaces
Panel.background = @background
Viewport.background = @background
ScrollPane.background = @background
MenuBar.background = #20242D
MenuBar.borderColor = #303641
PopupMenu.background = #242933
ToolTip.background = #2A303B
ToolTip.foreground = @foreground
Separator.foreground = #303641

# Interaction
Component.focusColor = #7AA2F7
Button.hoverBackground = #30394A
Button.pressedBackground = #253149
MenuItem.selectionBackground = #30466A
MenuItem.selectionForeground = #FFFFFF
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.showButtons = false
ScrollPane.smoothScrolling = true

# Application design tokens shared with custom window chrome
MangaReader.canvasBackground = #111318
MangaReader.titleBarBackground = #20242D
MangaReader.titleBarForeground = #E8ECF3
MangaReader.titleBarInactiveBackground = #1B1E26
MangaReader.titleBarInactiveForeground = #A8B0BF
MangaReader.titleBarBorder = #303641
MangaReader.titleBarHeight = {scaledInteger}30
MangaReader.titleBarButtonSize = {scaledDimension}44,30
MangaReader.titleBarButtonHoverBackground = #343A47
MangaReader.titleBarButtonPressedBackground = #292E39
MangaReader.titleBarCloseHoverBackground = #C94F5C
MangaReader.titleBarClosePressedBackground = #A73F4A
MangaReader.macTitleBarButtonSize = {scaledDimension}20,30
MangaReader.macTitleBarControlsInset = {scaledInteger}4
MangaReader.macTrafficLightClose = #FF5F57
MangaReader.macTrafficLightMinimize = #FEBC2E
MangaReader.macTrafficLightZoom = #28C840
MangaReader.macTrafficLightInactive = #696C74
MangaReader.macTrafficLightGlyph = #342A25
MangaReader.imageBorder = #303641
MangaReader.windowResizeHandleThickness = {scaledInteger}5
