plugins {
    id 'application'
}

application {
    mainClass = 'org.dustyroom.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

group = 'org.dustyroom'
version = '0.10.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    def lombokVersion = '1.18.48'

    implementation 'com.formdev:flatlaf:3.8'
    implementation 'org.xerial:sqlite-jdbc:3.54.1.0'
    implementation 'ch.qos.logback:logback-classic:1.6.6'
    implementation 'org.apache.commons:commons-lang3:3.21.0'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.dustyroom.Main',
                'Add-Exports': 'java.desktop/com.apple.eawt.event',
                'Enable-Native-Access': 'ALL-UNNAMED',
        )
    }
}

tasks.register('fatJar', Jar) {
    manifest.from jar.manifest
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}

tasks.named('assemble') {
    dependsOn tasks.named('fatJar')
}

test {
    def testTemp = layout.buildDirectory.dir('test-tmp')
    doFirst { testTemp.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', testTemp.get().asFile.absolutePath
    systemProperty 'org.sqlite.tmpdir', testTemp.get().asFile.absolutePath
    systemProperty 'java.awt.headless', 'true'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    useJUnitPlatform()
}

// Run against the distributable, not the test classpath: verifies JDBC service
// discovery and the platform-specific SQLite native library inside the fat JAR.
tasks.register('packagedStoreSmoke', Exec) {
    dependsOn tasks.named('fatJar')
    def smokeTemp = layout.buildDirectory.dir('packaged-smoke-tmp')
    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    doFirst {
        smokeTemp.get().asFile.mkdirs()
        commandLine launcher.get().executablePath.asFile.absolutePath,
                '-Djava.awt.headless=true', '--enable-native-access=ALL-UNNAMED',
                "-Dorg.sqlite.tmpdir=${smokeTemp.get().asFile.absolutePath}",
                '-cp', tasks.named('fatJar').get().archiveFile.get().asFile.absolutePath,
                'src/test/java/org/dustyroom/persistence/PackagedStoreSmoke.java'
    }
}

apply from: 'gradle/macos.gradle'

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

apply from: 'gradle/desktop-packages.gradle'

// Exercises the same JavaExec launch defaults as `run`, with future JNI restrictions enforced.
tasks.register('launchSmoke', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses'), tasks.named('packagedStoreSmoke')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.dustyroom.persistence.PackagedStoreSmoke'
    jvmArgs '--illegal-native-access=deny'
    systemProperty 'java.awt.headless', 'true'
    def smokeTemp = layout.buildDirectory.dir('launch-smoke-tmp')
    doFirst { smokeTemp.get().asFile.mkdirs() }
    systemProperty 'org.sqlite.tmpdir', smokeTemp.get().asFile.absolutePath
}
