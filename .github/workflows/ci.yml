name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 17 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Also validates the checked-in Gradle Wrapper JAR.
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests, fat JAR and packaged SQLite smoke test
        run: bash ./gradlew --no-daemon clean test fatJar packagedStoreSmoke
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: mangaReader-${{ matrix.os }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
