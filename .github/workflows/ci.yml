name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 17 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Also validates the checked-in Gradle Wrapper JAR.
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests, fat JAR and packaged SQLite smoke test
        run: bash ./gradlew --no-daemon clean test fatJar packagedStoreSmoke
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: mangaReader-${{ matrix.os }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    name: macOS DMG / Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: aarch64
      - uses: gradle/actions/setup-gradle@v5
      - name: Test and build standalone DMG
        run: bash ./gradlew --no-daemon clean test packageDmg
      - uses: actions/upload-artifact@v4
        with:
          name: YonakaReader-macOS-arm64-dmg
          path: build/macos/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  native-packages:
    name: Native packages / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            tasks: packageMsi packageWindowsZip
          - os: ubuntu-22.04
            platform: linux
            tasks: packageDeb packageLinuxTar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v5
      - name: Install DEB packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Locate WiX 3 tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Join-Path $env:WIX 'bin'
          if (!(Test-Path (Join-Path $wixBin 'candle.exe')) -or !(Test-Path (Join-Path $wixBin 'light.exe'))) {
            throw 'WiX 3 candle.exe and light.exe are required by JDK 17 jpackage.'
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and build native packages
        shell: bash
        run: bash ./gradlew --no-daemon clean test ${{ matrix.tasks }}
      - name: Verify extracted installer runtime
        shell: bash
        run: python packaging/tools/verify_installer.py ${{ matrix.platform }}
      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: YonakaReader-${{ matrix.platform }}-x64
          path: |
            build/desktop-packages/${{ matrix.platform }}/msi/*.msi
            build/desktop-packages/${{ matrix.platform }}/deb/*.deb
            build/desktop-packages/${{ matrix.platform }}/portable/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload packaging test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-reports-${{ matrix.platform }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/desktop-packages/${{ matrix.platform }}/msi-extract.log
          if-no-files-found: warn
          retention-days: 14
