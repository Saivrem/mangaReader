// Windows and Linux bundles share the same JAR, icon and supported extensions as macOS.
def appName = 'Yonaka Reader'
def root = layout.buildDirectory.dir('desktop-packages')
def jdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
def modules = 'java.se,jdk.unsupported,jdk.crypto.ec,jdk.charsets,jdk.localedata'
def architecture = ['amd64': 'x64', 'x86_64': 'x64', 'aarch64': 'arm64'].get(System.getProperty('os.arch'), System.getProperty('os.arch'))
def associations = {
    fileTree('packaging/macos/associations').matching { include '*.properties' }.files.sort()
            .collectMany { ['--file-associations', it.absolutePath] }
}

tasks.register('prepareDesktopInput', Sync) {
    dependsOn tasks.named('fatJar')
    from(tasks.named('fatJar').flatMap { it.archiveFile })
    from('THIRD_PARTY_NOTICES.md')
    into(root.map { it.dir('input') })
}

tasks.register('generateWindowsIcon', Exec) {
    def source = file('src/main/resources/org/dustyroom/ui/branding/yonaka.png')
    def icon = root.map { it.file('Yonaka.ico') }
    inputs.files(source, file('packaging/tools/WindowsIcon.java'))
    outputs.file(icon)
    doFirst {
        commandLine jdk.get().executablePath.asFile.absolutePath, '-Djava.awt.headless=true',
                'packaging/tools/WindowsIcon.java', source.absolutePath, icon.get().asFile.absolutePath
    }
}

tasks.register('compileDesktopSmoke', JavaCompile) {
    source = files('src/test/java/org/dustyroom/persistence/PackagedStoreSmoke.java')
    classpath = files(tasks.named('fatJar'))
    destinationDirectory = root.map { it.dir('smoke-classes') }
    options.release = 17
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
}

['Windows', 'Linux'].each { platform ->
    def windows = platform == 'Windows'
    def directory = root.map { it.dir(platform.toLowerCase(Locale.ROOT)) }
    def image = directory.map { it.dir("image/${appName}") }
    def requireHost = {
        def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        if (!(windows ? os.startsWith('windows') : os.startsWith('linux'))) {
            throw new GradleException("${platform} packages must be built on ${platform}; cross-packaging is not supported.")
        }
    }
    def packager = { jdk.get().metadata.installationPath.file(windows ? 'bin/jpackage.exe' : 'bin/jpackage').asFile.absolutePath }
    tasks.register("package${platform}App", Exec) {
        group = 'distribution'
        description = "Build the standalone ${platform} application with its own Java runtime."
        dependsOn tasks.named('prepareDesktopInput')
        if (windows) dependsOn tasks.named('generateWindowsIcon')
        doFirst {
            requireHost()
            delete(directory.get().dir('image'), directory.get().dir('app-temp'))
            def icon = windows ? root.get().file('Yonaka.ico').asFile : file('src/main/resources/org/dustyroom/ui/branding/yonaka.png')
            commandLine([packager(), '--type', 'app-image', '--name', appName,
                         '--app-version', project.version.toString(), '--vendor', 'Dustyroom',
                         '--description', 'Yonaka Reader - manga and image archive reader',
                         '--input', root.get().dir('input').asFile.absolutePath,
                         '--main-jar', tasks.named('fatJar').get().archiveFileName.get(),
                         '--main-class', 'org.dustyroom.Main', '--icon', icon.absolutePath,
                         '--dest', directory.get().dir('image').asFile.absolutePath,
                         '--temp', directory.get().dir('app-temp').asFile.absolutePath,
                         '--add-modules', modules,
                         '--jlink-options', '--strip-debug --no-man-pages --no-header-files'])
        }
    }
    tasks.register("verify${platform}App", Exec) {
        group = 'verification'
        description = "Test SQLite with the bundled ${platform} Java and packaged JAR."
        dependsOn tasks.named("package${platform}App"), tasks.named('compileDesktopSmoke')
        doFirst {
            requireHost()
            def temp = directory.get().dir('smoke-temp').asFile
            temp.mkdirs()
            def javaPath = windows ? 'runtime/bin/java.exe' : 'lib/runtime/bin/java'
            def appPath = windows ? 'app' : 'lib/app'
            commandLine image.get().file(javaPath).asFile.absolutePath,
                    '-Djava.awt.headless=true', "-Dorg.sqlite.tmpdir=${temp.absolutePath}",
                    '-cp', image.get().file("${appPath}/${tasks.named('fatJar').get().archiveFileName.get()}").asFile.absolutePath +
                        File.pathSeparator + tasks.named('compileDesktopSmoke').get().destinationDirectory.get().asFile.absolutePath,
                    'org.dustyroom.persistence.PackagedStoreSmoke'
        }
    }
    tasks.register(windows ? 'packageMsi' : 'packageDeb', Exec) {
        group = 'distribution'
        description = windows ? 'Build a per-user Windows MSI installer (requires WiX 3.x).' : 'Build an Ubuntu/Debian DEB installer (requires fakeroot and dpkg).'
        dependsOn tasks.named("verify${platform}App")
        doFirst {
            requireHost()
            def format = windows ? 'msi' : 'deb'
            delete(directory.get().dir(format), directory.get().dir('installer-temp'))
            def arguments = [packager(), '--type', format, '--name', appName,
                             '--app-version', project.version.toString(), '--vendor', 'Dustyroom',
                             '--description', 'Yonaka Reader - manga and image archive reader',
                             '--app-image', image.get().asFile.absolutePath,
                             '--dest', directory.get().dir(format).asFile.absolutePath,
                             '--temp', directory.get().dir('installer-temp').asFile.absolutePath]
            arguments.addAll(associations())
            if (windows) {
                arguments.addAll(['--win-per-user-install', '--win-dir-chooser', '--win-menu',
                                  '--win-menu-group', appName, '--win-shortcut',
                                  '--win-upgrade-uuid', '889b5499-ece2-4e0e-b39d-181256664276'])
            } else {
                arguments.addAll(['--linux-package-name', 'yonaka-reader', '--linux-shortcut',
                                  '--linux-menu-group', 'Graphics', '--linux-app-category', 'graphics',
                                  '--install-dir', '/opt'])
            }
            commandLine arguments
        }
    }
    if (windows) {
        tasks.register('packageWindowsZip', Zip) {
            group = 'distribution'
            description = 'Build a portable Windows ZIP; does not install shortcuts or associations.'
            dependsOn tasks.named('verifyWindowsApp')
            from(image) { into(appName) }
            destinationDirectory = directory.map { it.dir('portable') }
            archiveFileName = "YonakaReader-${project.version}-windows-${architecture}.zip"
        }
    } else {
        // Use native tar so executable permissions and runtime symlinks survive extraction.
        tasks.register('packageLinuxTar', Exec) {
            group = 'distribution'
            description = 'Build a portable Linux tar.gz, preserving runtime symlinks and executable bits.'
            dependsOn tasks.named('verifyLinuxApp')
            doFirst {
                requireHost()
                def destination = directory.get().dir('portable').asFile
                destination.mkdirs()
                commandLine 'tar', '-czf', new File(destination, "YonakaReader-${project.version}-linux-${architecture}.tar.gz").absolutePath,
                        '-C', directory.get().dir('image').asFile.absolutePath, appName
            }
        }
    }
}
