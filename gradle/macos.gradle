import javax.inject.Inject
import org.gradle.process.ExecOperations

interface MacProcessServices {
    @Inject ExecOperations getExecOperations()
}
def processes = objects.newInstance(MacProcessServices).execOperations

// Native macOS distribution. Keep application identity stable across releases.
def appVersion = project.version.toString()
def appName = 'Yonaka Reader'
def bundleId = 'org.dustyroom.mangareader'
// Apple's build version requires a positive first component, even for a 0.x release.
// Marketing/display version stays project.version; this is a separate, monotonic build identifier.
def parts = appVersion.split('\\.')
def bundleBuildVersion = "${parts[0].toInteger() + 1}.${parts[1]}.${parts[2]}"

def packageRoot = layout.buildDirectory.dir('macos')
def appBundle = packageRoot.map { it.dir("image/${appName}.app") }
def packageJdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
def requireMac = {
    if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('mac')) {
        throw new GradleException('macOS packaging must run on macOS with a macOS JDK 25.')
    }
}

tasks.register('generateMacIcon') {
    def source = file('src/main/resources/org/dustyroom/ui/branding/yonaka-original.png')
    def output = packageRoot.map { it.file('Yonaka.icns') }
    inputs.file(source)
    outputs.file(output)
    doLast {
        requireMac()
        def iconset = packageRoot.get().dir('Yonaka.iconset').asFile
        delete(iconset)
        iconset.mkdirs()
        [16, 32, 128, 256, 512].each { size ->
            [1, 2].each { density ->
                def suffix = density == 2 ? '@2x' : ''
                processes.exec {
                    commandLine 'sips', '-z', (size * density).toString(), (size * density).toString(),
                            source.absolutePath, '--out', new File(iconset, "icon_${size}x${size}${suffix}.png").absolutePath
                    standardOutput = new ByteArrayOutputStream()
                }
            }
        }
        processes.exec { commandLine 'iconutil', '-c', 'icns', iconset.absolutePath, '-o', output.get().asFile.absolutePath }
    }
}

tasks.register('prepareMacInput', Sync) {
    dependsOn tasks.named('fatJar')
    from(tasks.named('fatJar').flatMap { it.archiveFile })
    from('THIRD_PARTY_NOTICES.md')
    into(packageRoot.map { it.dir('input') })
}

tasks.register('packageMacApp', Exec) {
    group = 'distribution'
    description = 'Build a standalone macOS .app with its own Java runtime.'
    dependsOn tasks.named('prepareMacInput'), tasks.named('generateMacIcon')
    doFirst {
        requireMac()
        delete(packageRoot.get().dir('image'), packageRoot.get().dir('app-temp'))
        def jpackage = packageJdk.get().metadata.installationPath.file('bin/jpackage').asFile
        def args = [jpackage.absolutePath, '--type', 'app-image', '--name', appName,
                    '--app-version', bundleBuildVersion, '--vendor', 'Dustyroom',
                    '--description', 'Manga and image archive reader',
                    '--input', packageRoot.get().dir('input').asFile.absolutePath,
                    '--main-jar', tasks.named('fatJar').get().archiveFileName.get(),
                    '--main-class', 'org.dustyroom.Main',
                         '--java-options', '--enable-native-access=ALL-UNNAMED',
                    '--java-options', '--add-exports=java.desktop/com.apple.eawt.event=ALL-UNNAMED',
                    '--icon', packageRoot.get().file('Yonaka.icns').asFile.absolutePath,
                    '--dest', packageRoot.get().dir('image').asFile.absolutePath,
                    '--temp', packageRoot.get().dir('app-temp').asFile.absolutePath,
                    '--mac-package-identifier', bundleId, '--mac-package-name', appName,
                    '--mac-app-category', 'books',
                    '--add-modules', 'java.se,jdk.unsupported,jdk.crypto.ec,jdk.charsets,jdk.localedata',
                    '--jlink-options', '--strip-debug --no-man-pages --no-header-files']
        fileTree('packaging/macos/associations').matching { include '*.properties' }.files.sort().each {
            args.addAll(['--file-associations', it.absolutePath])
        }
        commandLine args
    }
    doLast {
        // Register as an alternate viewer; do not claim users' default image/ZIP associations.
        processes.exec {
            commandLine 'python3', 'packaging/macos/configure_bundle.py',
                    appBundle.get().asFile.absolutePath, appVersion, bundleBuildVersion
        }
        // The plist changed after jpackage's ad-hoc signing. Restore a valid local signature.
        processes.exec { commandLine 'codesign', '--force', '--deep', '--sign', '-', appBundle.get().asFile.absolutePath }
        processes.exec { commandLine 'codesign', '--verify', '--deep', '--strict', appBundle.get().asFile.absolutePath }
    }
}

tasks.register('compileMacSmoke', JavaCompile) {
    source = files('src/test/java/org/dustyroom/persistence/PackagedStoreSmoke.java')
    classpath = files(tasks.named('fatJar'))
    destinationDirectory = packageRoot.map { it.dir('smoke-classes') }
    options.release = 25
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('verifyMacApp', Exec) {
    group = 'verification'
    description = 'Check SQLite using the bundled runtime and packaged JAR, without a system Java.'
    dependsOn tasks.named('packageMacApp'), tasks.named('compileMacSmoke')
    doFirst {
        requireMac()
        def temp = packageRoot.get().dir('smoke-temp').asFile
        temp.mkdirs()
        def home = appBundle.get().dir('Contents')
        commandLine home.file('runtime/Contents/Home/bin/java').asFile.absolutePath,
                '-Djava.awt.headless=true', '--enable-native-access=ALL-UNNAMED', "-Dorg.sqlite.tmpdir=${temp.absolutePath}",
                '-cp', home.file("app/${tasks.named('fatJar').get().archiveFileName.get()}").asFile.absolutePath +
                    File.pathSeparator + tasks.named('compileMacSmoke').get().destinationDirectory.get().asFile.absolutePath,
                'org.dustyroom.persistence.PackagedStoreSmoke'
    }
}

tasks.register('packageDmg', Exec) {
    group = 'distribution'
    description = 'Create a drag-to-Applications DMG (no installer or background services).'
    dependsOn tasks.named('verifyMacApp')
    doFirst {
        requireMac()
        def destination = packageRoot.get().dir('dmg').asFile
        def staging = packageRoot.get().dir('dmg-staging').asFile
        delete(destination, staging)
        destination.mkdirs()
        staging.mkdirs()
        // Preserve bundle symlinks and signatures; do not rely on Finder AppleScript aliases.
        processes.exec { commandLine 'ditto', appBundle.get().asFile.absolutePath, new File(staging, "${appName}.app").absolutePath }
        java.nio.file.Files.createSymbolicLink(new File(staging, 'Applications').toPath(), java.nio.file.Path.of('/Applications'))
        def architectureOutput = new ByteArrayOutputStream()
        processes.exec {
            commandLine 'lipo', '-archs', appBundle.get().file("Contents/MacOS/${appName}").asFile.absolutePath
            standardOutput = architectureOutput
        }
        def architecture = architectureOutput.toString('UTF-8').trim().replace(' ', '-')
        def target = new File(destination, "YonakaReader-${appVersion}-macos-${architecture}.dmg")
        def help = new ByteArrayOutputStream()
        processes.exec {
            commandLine 'diskutil', 'image', 'create', 'from', '--help'
            standardOutput = help
            errorOutput = help
            ignoreExitValue = true
        }
        if (help.toString('UTF-8').contains('--volumeName')) {
            commandLine 'diskutil', 'image', 'create', 'from', '--volumeName', appName,
                    '--format', 'UDZO', staging.absolutePath, target.absolutePath
        } else {
            // Older macOS runners do not provide diskutil image yet.
            commandLine 'hdiutil', 'create', '-volname', appName, '-srcfolder', staging.absolutePath,
                    '-format', 'UDZO', '-fs', 'HFS+', '-ov', target.absolutePath
        }
    }
}
